<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Trackatrack</title>
<link rel="stylesheet" href="css/app.css">
</head>
<body>

<!-- ============ Header ============ -->
<div id="header">
  <div class="logo">TRACKA<span>TRACK</span></div>
  <span id="midiInd" class="hd-ind" title="MIDI indicator — lights while a MIDI signal is received">MIDI</span>
  <span id="connInd" class="hd-ind" title="Connection indicator — blue: all controllers connected, orange: some, unlit: none">CONN</span>
  <span id="audioInd" class="hd-ind" title="Audio indicator — blue: audio interface running, orange: suspended, red: none">AUDIO</span>
  <span id="recInd" class="hd-ind" title="Recording indicator — red while AUDIO RECORDER records">REC</span>
  <span id="loadWrap" class="hd-load" title="Load — computing time used per audio buffer">LOAD<b class="loadbar"><i id="loadFill"></i></b><em id="loadPct">0%</em></span>
  <span class="grow"></span>
  <canvas id="masterMeter" class="hmeter" title="Master Output level meter"></canvas>
  <span id="clock" title="System Clock — time of day">--:--:--</span>
  <select id="layoutSel" class="tb" title="Layout selector">
    <option value="2d">2 Deck</option>
  </select>
  <button id="maxBrowserBtn" class="btn tb" title="Maximize Browser">⊞</button>
  <button id="prefsBtn" class="btn tb" title="Preferences">⚙</button>
  <button id="cruiseBtn" class="btn tb" title="Cruise Mode — automatically play the next track">CRUISE</button>
  <button id="tipBtn" class="btn tb on" title="Tooltip button">?</button>
  <button id="fsBtn" class="btn tb" title="Fullscreen button">⛶</button>
  <button id="monBtn" class="btn tb" title="MIDI monitor / learn">MON</button>
</div>

<!-- ============ Global section: FX Unit 1 | Master Control | FX Unit 2 ============ -->
<div id="globalsec">
  <div class="sel-col">
    <button id="selU1" class="btn selbtn on" title="Show FX Unit 1">FX 1</button>
    <button id="selLRec" class="btn selbtn" title="Show LOOP RECORDER">LOOP REC</button>
  </div>
  <div class="fxunit" id="unit1"></div>
  <div id="lrec" class="gpanel hidden"></div>
  <div id="mctrl">
    <div class="mc-left">
      <button id="snapBtn" class="btn mc-b" title="Snap controls to beat grid">SNAP</button>
      <button id="quantBtn" class="btn mc-b" title="Quantize value — click to cycle">QUANT</button>
      <button id="linkBtn" class="btn mc-b" title="Link deck tempos">LINK</button>
    </div>
    <div class="mc-mid">
      <div id="mTempo" class="mc-tempo" title="Master Clock tempo — drag to adjust, double-click to enter">120.00</div>
      <div class="mc-sub">
        <button id="tapBtn" class="btn mc-b" title="Tap in the Master Clock tempo">TAP</button>
        <button id="tickBtn" class="btn mc-b" title="Metronome (Master Clock Tick)">♪</button>
        <button id="mDownBtn" class="btn mc-b" title="Master Tempo down">−</button>
        <button id="mUpBtn" class="btn mc-b" title="Master Tempo up">+</button>
      </div>
      <div class="mc-clk">
        <button id="autoBtn" class="btn mc-b on" title="Master clock follows playing deck">AUTO</button>
        <button id="mclockBtn" class="btn mc-b" title="Master clock held by MASTER deck">MASTER</button>
      </div>
    </div>
    <div class="mc-right">
      <div id="mainKnob"></div>
      <button id="limBtn" class="btn mc-b lim on" title="Master limiter">LIMITER</button>
    </div>
  </div>
  <div class="fxunit" id="unit2"></div>
  <div id="arec" class="gpanel hidden"></div>
  <div class="sel-col">
    <button id="selARec" class="btn selbtn" title="Show AUDIO RECORDER">AUDIO REC</button>
    <button id="selU2" class="btn selbtn on" title="Show FX Unit 2">FX 2</button>
  </div>
</div>

<!-- ============ Decks + Mixer ============ -->
<div id="decks">
  <div class="deckslot" id="deckslotA"></div>
  <div id="mixer">
    <div id="strips"></div>
    <div id="xfrow">
      <span class="xf-lab">A</span>
      <div id="xfader"></div>
      <span class="xf-lab">B</span>
      <span class="grow"></span>
      <div id="cueKnob"></div>
    </div>
  </div>
  <div class="deckslot" id="deckslotB"></div>
</div>

<!-- ============ Browser ============ -->
<div id="library"></div>

<template id="lrecTpl">
  <div class="lrec">
    <b class="gp-title">LOOP RECORDER</b>
    <div class="lr-row">
      <select id="lrSrc" class="tb" title="Source for the recording">
        <option value="m">Master</option><option value="0">Deck A</option><option value="1">Deck B</option>
      </select>
      <span class="lr-sizes" title="SIZE — initial length of the recording">
        <button class="btn sm lr-size" data-b="0.5">½</button>
        <button class="btn sm lr-size on" data-b="1">1</button>
        <button class="btn sm lr-size" data-b="2">2</button>
        <button class="btn sm lr-size" data-b="4">4</button>
        <button class="btn sm lr-size" data-b="8">8</button>
      </span>
      <div class="lr-prog" title="Progress — current length of the recording"><i id="lrFill"></i></div>
      <span id="lrLen" class="mono">–</span>
    </div>
    <div class="lr-row">
      <button id="lrRec" class="btn sm" title="Record / overdub">● REC</button>
      <button id="lrPlay" class="btn sm" title="Play / stop the loop">▶ PLAY</button>
      <button id="lrDel" class="btn sm" title="Delete the recorded loop">DEL</button>
      <button id="lrUndo" class="btn sm" title="Undo last overdub">↶</button>
      <button id="lrRedo" class="btn sm" title="Redo">↷</button>
      <span id="lrDW" class="lr-dw"></span>
    </div>
  </div>
</template>

<template id="arecTpl">
  <div class="arec">
    <b class="gp-title">AUDIO RECORDER</b>
    <div class="ar-row">
      <span id="arDisp" class="mono big">00:00 · 0.0 MB</span>
      <canvas id="arMeter" class="ar-meter" title="Recording meter"></canvas>
    </div>
    <div class="ar-row">
      <button id="arRec" class="btn sm" title="Start / stop recording">● REC</button>
      <button id="arCut" class="btn sm" title="Save current file and start a new one">CUT</button>
      <span id="arGainK"></span>
      <a id="arDl" class="ar-dl hidden" download="trackatrack.webm">⬇ take</a>
      <span id="arTakes" class="mono">0 takes</span>
    </div>
  </div>
</template>

<div id="prefsModal" class="modal hidden">
  <div class="modal-box">
    <div class="modal-head"><b>Preferences</b><button id="prefsClose" class="btn">✕</button></div>
    <div class="pref-grid">
      <label>Master out</label><select id="masterOut"></select>
      <label>Phones out</label><select id="cueOut"></select>
      <label>Master limiter</label><input type="checkbox" id="prefLimiter" checked>
      <label>Sample rate</label><span id="prefSr" class="mono">–</span>
      <label>Output latency</label><span id="prefLat" class="mono">–</span>
    </div>
    <div class="modal-note">Preferences — output routing &amp; master settings.</div>
  </div>
</div>

<template id="unitTpl">
  <div class="fxunit">
    <div class="u-num">1:</div>
    <div class="u-dw"></div>
    <div class="u-sels"></div>
    <div class="u-param"></div>
    <div class="u-rst"><button class="btn u-rstb" title="Reset all unit parameters">RST</button></div>
  </div>
</template>

<template id="deckTpl">
  <div class="deckmod">
    <div class="d-info">
      <div class="d-meta">
        <div class="d-title">–</div>
        <div class="d-artist"></div>
        <div class="d-state"></div>
      </div>
      <div class="grow"></div>
      <div class="d-times"><span class="d-remain">--:--</span><span class="d-dur">--:--</span></div>
      <div class="d-tempos"><span class="d-bpm">–</span><span class="t-pct">+0.0%</span><span class="d-trackbpm">–</span></div>
      <div class="d-key"></div>
      <div class="d-letter">?</div>
    </div>
    <div class="d-row1">
      <button class="btn sync" title="Sync to master clock">SYNC</button>
      <button class="btn master" title="Make this deck the master">MASTER</button>
      <canvas class="d-ruler" title="Beat grid — drag to shift"></canvas>
      <button class="btn prev" title="Load previous track">◀◀</button>
      <button class="btn next" title="Load next track">▶▶</button>
    </div>
    <div class="deck-main"><canvas class="d-detail"></canvas></div>
    <div class="deck-ov">
      <button class="btn to-cue" title="Jump to start position">⇤</button>
      <canvas class="d-ov"></canvas>
      <button class="btn reveal" title="Show track in browser">♪</button>
      <span class="zoom"><button class="btn z-out" title="Zoom out">−</button><span class="z-lbl">32</span><button class="btn z-in" title="Zoom in">+</button></span>
    </div>
    <div class="deck-t">
      <button class="btn play" title="Play/Pause (Space)">▶</button>
      <button class="btn cue">CUE</button>
      <button class="btn cup">CUP</button>
      <span class="tsep"></span>
      <button class="btn flx" title="Slip mode">FLX</button>
      <button class="btn rev" title="Reverse">REV</button>
      <span class="tsep"></span>
      <span class="loopbtns">
        <button class="btn lhalf" title="Halve loop">‹</button>
        <button class="btn lb" data-n="1">1</button>
        <button class="btn lb" data-n="2">2</button>
        <button class="btn lb" data-n="4">4</button>
        <button class="btn lb" data-n="8">8</button>
        <button class="btn ldbl" title="Double loop">›</button>
      </span>
      <span class="tsep"></span>
      <button class="btn lin">IN</button>
      <button class="btn lout">OUT</button>
      <span class="btn lact d-loopind">ACTIVE</span>
    </div>
    <div class="deck-rail">
      <div class="tempo"></div>
      <div class="vlabel">TEMPO</div>
    </div>
  </div>
</template>

<template id="stripTpl">
  <div class="strip">
    <div class="s-letter">A</div>
    <div class="s-knobs"></div>
    <div class="s-fxbtns">
      <button class="btn sfx1" title="Route this channel to FX Unit 1">1</button>
      <button class="btn sfx2" title="Route this channel to FX Unit 2">2</button>
      <span class="sfx-label">FX</span>
    </div>
    <div class="s-low">
      <div class="s-vol"></div>
      <canvas class="s-meter"></canvas>
    </div>
    <button class="btn pfl" title="Cue this channel in headphones">🎧</button>
    <div class="s-key"></div>
  </div>
</template>

<script>
window.__errs = [];
window.addEventListener("error", (e) => window.__errs.push(e.message + " @" + e.filename + ":" + e.lineno));
window.addEventListener("unhandledrejection", (e) => window.__errs.push("REJECT: " + ((e.reason && (e.reason.stack || e.reason.message)) || e.reason)));
setInterval(() => { if (window.__errs.length) document.title = "ERRS: " + window.__errs.slice(-3).join(" | "); }, 1500);
if (!window.isSecureContext && !/^\d+\.\d+\.\d+\.\d+$/.test(location.hostname) && location.hostname !== "localhost") {
  const b = document.createElement("div");
  b.id = "insecbar";
  b.innerHTML = "Plain <b>http://hostname</b> is not a secure context in Chrome &mdash; Web Audio is blocked."
    + " Use <b>https://" + location.hostname + ":8443</b>"
    + " or <b>http://192.168.9.58:8360</b>";
  document.body.appendChild(b);
}
</script>
<script type="module" src="js/main.js"></script>
</body>
</html>
